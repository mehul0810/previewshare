name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, for example v1.0.0.
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PLUGIN_SLUG: previewshare

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.ref_name, '-')
    timeout-minutes: 45
    steps:
      - name: Resolve release context
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="${REF_NAME}"
          fi

          if [[ -z "${TAG_NAME}" ]]; then
            echo "A release tag is required." >&2
            exit 1
          fi

          if [[ ! "${TAG_NAME}" =~ ^v?[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Release tag must look like v1.0.0." >&2
            exit 1
          fi

          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_file=${PLUGIN_SLUG}-${TAG_NAME}.zip" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${PLUGIN_SLUG}-release-${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify release tag points to current main
        shell: bash
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          TAG_SHA="$(git rev-parse "${TAG_NAME}^{commit}")"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          if [[ "${TAG_SHA}" != "${MAIN_SHA}" ]]; then
            echo "Release tag ${TAG_NAME} (${TAG_SHA}) must point to current origin/main (${MAIN_SHA})." >&2
            exit 1
          fi

      - name: Validate release version
        shell: bash
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          PLUGIN_VERSION="$(awk -F: '/^[[:space:]]*[*][[:space:]]Version:/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' previewshare.php)"
          STABLE_TAG="$(awk -F: '/^Stable tag:/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' readme.txt)"
          TAG_VERSION="${TAG_NAME#v}"

          if [[ "${PLUGIN_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Plugin header version (${PLUGIN_VERSION}) must match release tag (${TAG_VERSION})." >&2
            exit 1
          fi

          if [[ "${STABLE_TAG}" != "${TAG_VERSION}" ]]; then
            echo "readme.txt Stable tag (${STABLE_TAG}) must match release tag (${TAG_VERSION})." >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction

      - name: Audit Composer dependencies
        run: composer audit:php

      - name: Run PHP syntax checks
        run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHP coding standards
        run: composer check-cs

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPUnit coverage smoke
        run: composer test:coverage

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon

      - name: Install JS dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm run audit:prod

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Build production zip
        run: npm run plugin-zip

      - name: Validate production zip
        run: npm run validate:zip

      - name: Validate WordPress.org assets
        run: npm run validate:wporg

      - name: Prepare SVN deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/svn
          mkdir -p build/svn
          unzip -q previewshare.zip -d build/svn
          test -f "build/svn/${PLUGIN_SLUG}/previewshare.php"

      - name: Rename artifact
        run: mv previewshare.zip "${{ steps.release.outputs.zip_file }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ steps.release.outputs.zip_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifact to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          ZIP_FILE: ${{ steps.release.outputs.zip_file }}
        run: |
          set -euo pipefail

          NOTES="Production-ready PreviewShare release artifact."

          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ZIP_FILE}" --clobber
          else
            gh release create "${TAG_NAME}" "${ZIP_FILE}" --title "${TAG_NAME}" --notes "${NOTES}" --verify-tag
          fi

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.PLUGIN_SLUG }}
          ASSETS_DIR: .wordpress-org
          BUILD_DIR: build/svn/${{ env.PLUGIN_SLUG }}
