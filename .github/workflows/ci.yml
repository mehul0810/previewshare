name: CI

on:
  workflow_dispatch:
    inputs:
      run_abilities_runtime:
        description: 'Run the native Abilities API wp-env proof matrix'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: pcov
      - name: Get Composer Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction
      - name: Audit Composer dependencies
        run: composer audit:php
      - name: Run PHP syntax checks
        run: composer lint
      - name: Run PHP coding standards
        run: composer check-cs
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPUnit coverage smoke
        run: composer test:coverage
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon

  js:
    name: JS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Audit production npm dependencies
        run: npm run audit:prod
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css
      - name: Run JavaScript unit tests
        run: npm run test:js
      - name: Build assets
        run: npm run build

  package:
    name: Release package smoke
    runs-on: ubuntu-latest
    needs: [ php, js ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Install JS dependencies
        run: npm ci
      - name: Build plugin zip
        run: npm run plugin-zip
      - name: Validate plugin zip
        run: npm run validate:zip
      - name: Validate WordPress.org assets
        run: npm run validate:wporg

  abilities-runtime:
    name: Abilities API runtime (${{ matrix.wordpress }})
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_abilities_runtime == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - '5.8.17'
          - '6.9.7'
          - '7.1.2'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Install JS dependencies
        run: npm ci
      - name: Run Abilities API runtime proof
        env:
          PREVIEWSHARE_WP_VERSION: ${{ matrix.wordpress }}
        run: npm run test:abilities:runtime
