name: CI

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run the Playwright e2e smoke job'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: pcov
      - name: Get Composer Cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction
      - name: Audit Composer dependencies
        run: composer audit:php
      - name: Run PHP syntax checks
        run: composer lint
      - name: Run PHP coding standards
        run: composer check-cs
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPUnit coverage smoke
        run: composer test:coverage
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon

  js:
    name: JS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Audit production npm dependencies
        run: npm run audit:prod
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css
      - name: Run JavaScript unit tests
        run: npm run test:js
      - name: Build assets
        run: npm run build

  package:
    name: Release package smoke
    runs-on: ubuntu-latest
    needs: [ php, js ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install JS dependencies
        run: npm ci
      - name: Build plugin zip
        run: npm run plugin-zip
      - name: Validate plugin zip
        run: npm run validate:zip

  e2e:
    name: Playwright e2e smoke
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    needs: [ php, js ]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Install JS dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run PreviewShare e2e smoke
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm run test:e2e
      - name: Upload e2e screenshot proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: previewshare-e2e-screenshots-${{ github.run_id }}
          path: artifacts/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7
