name: CI

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run the Playwright e2e smoke job'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      wp_version:
        description: 'WordPress version for the E2E smoke job'
        required: false
        default: latest
        type: choice
        options:
          - latest
          - '5.8.17'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  php:
    name: PHP checks (PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            os: ubuntu-22.04
          - php: '8.1'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: pcov
      - name: Get Composer Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: vendor
          key: ${{ matrix.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction
      - name: Audit Composer dependencies
        run: composer audit:php
      - name: Run PHP syntax checks
        run: composer lint
      - name: Run PHP coding standards
        run: composer check-cs
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPUnit coverage smoke
        run: composer test:coverage
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon

  js:
    name: JS build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production npm dependencies
        run: npm run audit:prod
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css
      - name: Run JavaScript unit tests
        run: npm run test:js
      - name: Build assets
        run: npm run build

  package:
    name: Release package smoke
    runs-on: ubuntu-latest
    needs: [ php, js ]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JS dependencies
        run: npm ci
      - name: Build plugin zip
        run: npm run plugin-zip
      - name: Validate plugin zip
        run: npm run validate:zip
      - name: Validate WordPress.org assets
        run: npm run validate:wporg

  e2e:
    name: Playwright e2e smoke (WordPress ${{ matrix.wp_version }})
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    needs: [ php, js ]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        wp_version: ${{ github.event_name == 'pull_request' && fromJSON('["5.8.17", "latest"]') || fromJSON(format('["{0}"]', github.event.inputs.wp_version || 'latest')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Install JS dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Select the minimum supported WordPress version
        if: matrix.wp_version == '5.8.17'
        run: echo "WP_ENV_CORE=WordPress/WordPress#5.8.17" >> "$GITHUB_ENV"
      - name: Run PreviewShare e2e smoke
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm run test:e2e
      - name: Upload e2e screenshot proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: previewshare-e2e-screenshots-${{ github.run_id }}-wp-${{ matrix.wp_version }}
          path: artifacts/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7
