name: CI

on:
  workflow_dispatch:
    inputs:
      run_abilities_runtime:
        description: 'Run the native Abilities API wp-env proof matrix'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: pcov
      - name: Get Composer Cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction
      - name: Audit Composer dependencies
        run: composer audit:php
      - name: Run PHP syntax checks
        run: composer lint
      - name: Run PHP coding standards
        run: composer check-cs
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPUnit coverage smoke
        run: composer test:coverage
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon

  js:
    name: JS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Audit production npm dependencies
        run: npm run audit:prod
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css
      - name: Run JavaScript unit tests
        run: npm run test:js
      - name: Build assets
        run: npm run build

  package:
    name: Release package smoke
    runs-on: ubuntu-latest
    needs: [ php, js ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install JS dependencies
        run: npm ci
      - name: Build plugin zip
        run: npm run plugin-zip
      - name: Validate plugin zip
        run: npm run validate:zip

  abilities-runtime:
    name: Abilities API runtime (${{ matrix.wordpress }})
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_abilities_runtime == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - '6.8.7'
          - '6.9.7'
          - '7.1'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install Composer deps
        run: composer install --no-progress --prefer-dist
      - name: Install JS dependencies
        run: npm ci
      - name: Run Abilities API runtime proof
        env:
          PREVIEWSHARE_WP_VERSION: ${{ matrix.wordpress }}
        run: npm run test:abilities:runtime
